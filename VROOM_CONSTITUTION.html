ationale {\n            position: absolute;\n            top: 220px;\n            right: 80px;\n            width: 380px;\n            padding: 30px;\n            background: rgba(0, 102, 255, 0.05);\n            border: 1px solid rgba(0, 102, 255, 0.15);\n            border-radius: 16px;\n        }\n        .rationale-title {\n            font-size: 14px;\n            font-weight: 600;\n            color: #FFD600;\n            margin-bottom: 16px;\n            letter-spacing: 0.1em;\n            text-transform: uppercase;\n        }\n        .rationale-text {\n            font-family: 'Inter', sans-serif;\n            font-size: 15px;\n            line-height: 1.7;\n            color: rgba(255, 255, 255, 0.7);\n        }\n        .rationale-text strong {\n            color: #fff;\n            font-weight: 500;\n        }\n    </style>\n</head>\n<body>\n    <div class=\"slide\">\n        <div class=\"bg-glow\"></div>\n        <div class=\"header\">\n            <div class=\"pre-title\">Brand Identity</div>\n            <h1 class=\"title\">The Symbol</h1>\n        </div>\n        <div class=\"rationale\">\n            <div class=\"rationale-title\">Design Rationale</div>\n            <p class=\"rationale-text\">\n                The <strong>VROOM arrow</strong> combines forward momentum with reliability. \n                The chevron points toward progress, while the circle represents \n                completeness \u2014 an ecosystem where <strong>every automotive need finds its answer</strong>.\n            </p>\n        </div>\n        <div class=\"main-symbol-area\">\n            <div class=\"context-rings\">\n                <div class=\"ring\"></div>\n                <div class=\"ring\"></div>\n                <div class=\"ring\"></div>\n            </div>\n            <div class=\"symbol-glow\"></div>\n            <div class=\"main-symbol\">\n                <svg viewBox=\"0 0 200 200\">\n                    <defs>\n                        <linearGradient id=\         function showSlide(n) {

            localStorage.setItem('v3-slide', n);

        const saved = localStorage.getItem('v3-slide');
