<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,height=1080">
<title>VROOM - Venezuela's Automotive Future</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;font-family:'Inter',sans-serif;background:linear-gradient(135deg,#050510 0%,#0a0a1a 50%,#0d1020 100%);position:relative}
.glow{position:absolute;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(0,102,255,0.15) 0%,transparent 70%);top:-200px;right:-100px}
.glow2{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,0,0.08) 0%,transparent 70%);bottom:-100px;left:200px}
.speed-lines{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;opacity:0.3}
.speed-line{position:absolute;height:2px;background:linear-gradient(90deg,transparent,rgba(0,102,255,0.8),transparent);animation:speed 2s linear infinite}
@keyframes speed{from{transform:translateX(-100%)}to{transform:translateX(2500px)}}
.speed-line:nth-child(1){top:20%;width:400px;animation-delay:0s}
.speed-line:nth-child(2){top:35%;width:600px;animation-delay:0.3s}
.speed-line:nth-child(3){top:50%;width:500px;animation-delay:0.7s}
.speed-line:nth-child(4){top:65%;width:350px;animation-delay:1.1s}
.car-container{position:absolute;right:-50px;top:50%;transform:translateY(-50%);width:1100px;height:400px}
.car-svg{width:100%;height:100%}
.content{position:absolute;left:80px;top:50%;transform:translateY(-50%);z-index:10}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px;letter-spacing:8px;color:#fff;margin-bottom:60px;display:flex;align-items:center;gap:20px}
.logo-mark{width:60px;height:60px;position:relative}
.logo-mark svg{width:100%;height:100%}
.vroom-text{background:linear-gradient(90deg,#0066FF,#00AAFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tagline{font-family:'Space Grotesk',sans-serif;font-size:72px;font-weight:700;color:#fff;line-height:1.1;margin-bottom:30px;max-width:600px;text-shadow:0 4px 30px rgba(0,102,255,0.3)}
.sub-line{font-size:24px;color:rgba(255,255,255,0.7);font-weight:300;letter-spacing:1px;margin-bottom:50px}
.year{font-family:'Space Grotesk',sans-serif;font-size:18px;color:rgba(255,255,255,0.5);letter-spacing:4px;font-weight:500}
.corner{position:absolute;width:100px;height:100px;border:2px solid rgba(0,102,255,0.3)}
.corner-tl{top:30px;left:30px;border-right:none;border-bottom:none}
.corner-tr{top:30px;right:30px;border-left:none;border-bottom:none}
.corner-bl{bottom:30px;left:30px;border-right:none;border-top:none}
.corner-br{bottom:30px;right:30px;border-left:none;border-top:none}
</style>
</head>
<body>
<div class="glow"></div>
<div class="glow2"></div>
<div class="speed-lines">
<div class="speed-line"></div><div class="speed-line"></div><div class="speed-line"></div><div class="speed-line"></div>
</div>
<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>

<div class="content">
<div class="logo">
<div class="logo-mark">
<svg viewBox="0 0 60 60" fill="none">
<path d="M10 50 L30 10 L50 50" stroke="#0066FF" stroke-width="4" fill="none" stroke-linecap="round"/>
<path d="M18 35 L30 18 L42 35" fill="#FFD600" opacity="0.9"/>
<path d="M5 55 L30 5 L55 55" stroke="url(#logoGrad)" stroke-width="2" fill="none" opacity="0.3"/>
<defs>
<linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0066FF"/>
<stop offset="100%" stop-color="#FFD600"/>
</linearGradient>
</defs>
</svg>
</div>
<span class="vroom-text">VROOM</span>
</div>
<div class="tagline">Venezuela's<br>Automotive Future</div>
<div class="sub-line">Everything your car needs. In minutes.</div>
<div class="year">VISION 2026 — 2030</div>
</div>

<div class="car-container">
<svg class="car-svg" viewBox="0 0 1100 400" preserveAspectRatio="xMidYMid meet">
<defs>
<linearGradient id="carBody" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#1a1a2e"/>
<stop offset="50%" stop-color="#0f0f1a"/>
<stop offset="100%" stop-color="#050510"/>
</linearGradient>
<linearGradient id="carHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#0066FF" stop-opacity="0.3"/>
<stop offset="50%" stop-color="#0066FF" stop-opacity="0.6"/>
<stop offset="100%" stop-color="#0066FF" stop-opacity="0.3"/>
</linearGradient>
<linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#0066FF" stop-opacity="0.4"/>
<stop offset="100%" stop-color="#0a0a1a" stop-opacity="0.9"/>
</linearGradient>
<filter id="glow">
<feGaussianBlur stdDeviation="3" result="coloredBlur"/>
<feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<!-- Ground shadow -->
<ellipse cx="550" cy="380" rx="450" ry="20" fill="#0066FF" opacity="0.1"/>
<!-- Car body - sleek sports car profile -->
<path d="M80 280 Q100 260 150 250 L280 230 Q320 200 380 180 L480 160 Q520 155 560 155 L680 155 Q720 155 760 170 L850 200 Q900 220 920 250 L950 270 Q970 280 980 290 L980 310 Q980 330 950 330 L150 330 Q120 330 100 310 L80 290 Z" fill="url(#carBody)" stroke="#0066FF" stroke-width="1" stroke-opacity="0.5"/>
<!-- Window -->
<path d="M320 225 Q360 195 420 175 L500 160 Q530 155 560 155 L640 155 Q680 155 700 165 L780 195 Q810 210 820 225 L340 225 Q330 225 320 225 Z" fill="url(#windowGrad)"/>
<!-- Headlight -->
<path d="M920 260 L970 270 L970 285 L920 280 Z" fill="#FFD600" filter="url(#glow)" opacity="0.9"/>
<!-- Taillight -->
<path d="M100 295 L140 290 L140 300 L100 305 Z" fill="#FF3333" filter="url(#glow)" opacity="0.8"/>
<!-- Wheels -->
<circle cx="220" cy="330" r="55" fill="#0a0a1a" stroke="#333" stroke-width="3"/>
<circle cx="220" cy="330" r="40" fill="#1a1a2e" stroke="#0066FF" stroke-width="2" stroke-opacity="0.5"/>
<circle cx="220" cy="330" r="15" fill="#0066FF" opacity="0.8"/>
<circle cx="820" cy="330" r="55" fill="#0a0a1a" stroke="#333" stroke-width="3"/>
<circle cx="820" cy="330" r="40" fill="#1a1a2e" stroke="#0066FF" stroke-width="2" stroke-opacity="0.5"/>
<circle cx="820" cy="330" r="15" fill="#0066FF" opacity="0.8"/>
<!-- Highlight line -->
<path d="M150 250 Q300 235 500 210 L800 190 Q900 185 950 200" stroke="url(#carHighlight)" stroke-width="2" fill="none"/>
<!-- Brand mark on car -->
<circle cx="550" cy="250" r="20" fill="#0066FF" opacity="0.3"/>
<path d="M540 260 L550 245 L560 260" stroke="#FFD600" stroke-width="2" fill="none"/>
</svg>
</div>
</body>
</html>
