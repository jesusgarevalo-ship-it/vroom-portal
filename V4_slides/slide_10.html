<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,height=1080">
<title>VROOM in Caracas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;font-family:'Inter',sans-serif;background:linear-gradient(180deg,#020208 0%,#0a0a15 100%);position:relative}
.scene{position:absolute;inset:0;overflow:hidden}
/* Sky gradient with stars */
.sky{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(0,102,255,0.1) 0%,transparent 50%)}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:0.6}
/* Buildings - Caracas skyline */
.buildings{position:absolute;bottom:200px;left:0;right:0;height:450px}
.building{position:absolute;bottom:0;background:linear-gradient(180deg,#0a0a15 0%,#030308 100%)}
.building::before{content:'';position:absolute;inset:10px;background-image:repeating-linear-gradient(0deg,transparent,transparent 20px,rgba(255,214,0,0.1) 20px,rgba(255,214,0,0.1) 22px),repeating-linear-gradient(90deg,transparent,transparent 15px,rgba(255,214,0,0.1) 15px,rgba(255,214,0,0.1) 17px)}
.building::after{content:'';position:absolute;top:10px;left:10px;right:10px;bottom:10px;background-image:radial-gradient(circle 3px at 25px 30px,rgba(255,214,0,0.4) 0%,transparent 100%),radial-gradient(circle 3px at 75px 50px,rgba(255,214,0,0.3) 0%,transparent 100%),radial-gradient(circle 3px at 125px 40px,rgba(255,214,0,0.5) 0%,transparent 100%),radial-gradient(circle 3px at 50px 80px,rgba(0,102,255,0.3) 0%,transparent 100%)}
.b1{left:2%;width:100px;height:320px}
.b2{left:10%;width:80px;height:400px}
.b3{left:18%;width:120px;height:280px}
.b4{left:28%;width:90px;height:380px}
.b5{left:38%;width:110px;height:350px}
.b6{left:48%;width:140px;height:420px}
.b7{left:60%;width:100px;height:300px}
.b8{left:70%;width:130px;height:380px}
.b9{left:82%;width:90px;height:340px}
.b10{left:92%;width:80px;height:290px}
/* Street level */
.street{position:absolute;bottom:0;left:0;right:0;height:200px;background:linear-gradient(180deg,#0a0a15 0%,#050508 100%)}
.sidewalk{position:absolute;top:0;left:0;right:0;height:50px;background:#0f0f1a}
/* Street lights */
.light-pole{position:absolute;bottom:200px;width:6px;height:120px;background:linear-gradient(180deg,#333 0%,#222 100%)}
.light-pole::after{content:'';position:absolute;top:-5px;left:-15px;width:36px;height:15px;background:#333;border-radius:3px}
.light-glow{position:absolute;bottom:200px;width:100px;height:100px;background:radial-gradient(circle,rgba(255,214,0,0.3) 0%,transparent 70%);border-radius:50%}
.pole1{left:15%}
.pole1::after{left:15px}
.glow1{left:calc(15% - 47px);bottom:280px}
.pole2{left:45%}
.glow2{left:calc(45% - 47px);bottom:280px}
.pole3{left:75%}
.glow3{left:calc(75% - 47px);bottom:280px}
/* VROOM Billboard */
.billboard{position:absolute;top:180px;right:120px;width:300px;height:150px;background:#0066FF;border:4px solid #0055DD;box-shadow:0 10px 40px rgba(0,102,255,0.4)}
.billboard-inner{padding:20px;text-align:center;height:100%;display:flex;flex-direction:column;justify-content:center}
.billboard-logo{font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:700;color:#fff;margin-bottom:8px}
.billboard-tag{font-size:12px;color:rgba(255,255,255,0.8);text-transform:uppercase;letter-spacing:3px}
.billboard-cta{font-size:14px;color:#FFD600;margin-top:10px;font-weight:500}
.billboard-glow{position:absolute;top:-20px;left:-20px;right:-20px;bottom:-20px;background:radial-gradient(ellipse,rgba(0,102,255,0.3) 0%,transparent 70%);pointer-events:none}
/* VROOM Digital Screen */
.digital-screen{position:absolute;top:400px;left:280px;width:100px;height:150px;background:#0D1117;border:2px solid rgba(0,102,255,0.5);border-radius:5px;padding:10px;box-shadow:0 0 20px rgba(0,102,255,0.3)}
.screen-logo{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;color:#0066FF;text-align:center;margin-bottom:5px}
.screen-text{font-size:8px;color:#FFD600;text-align:center}
/* VROOM Delivery Motorcycle */
.motorcycle{position:absolute;bottom:160px;left:500px;width:150px;height:80px}
.moto-svg{width:100%;height:100%}
/* VROOM App on Phone (pedestrian) */
.pedestrian{position:absolute;bottom:155px;left:850px}
.ped-phone{width:30px;height:50px;background:#0a0a1a;border:2px solid #333;border-radius:4px;padding:3px;box-shadow:0 0 15px rgba(255,214,0,0.3)}
.ped-screen{width:100%;height:100%;background:#0066FF;border-radius:2px;display:flex;align-items:center;justify-content:center}
.ped-logo{font-family:'Space Grotesk',sans-serif;font-size:6px;font-weight:700;color:#fff}
.ped-figure{width:4px;height:30px;background:#1a1a2e;margin:0 auto;border-radius:2px;position:relative}
.ped-head{width:12px;height:12px;background:#2a2a3e;border-radius:50%;position:absolute;top:-8px;left:-4px}
/* Overlay text */
.overlay{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;justify-content:flex-start}
.main-text{position:absolute;top:60px;left:80px}
.main-text h1{font-family:'Space Grotesk',sans-serif;font-size:64px;font-weight:700;color:#fff;text-shadow:0 4px 40px rgba(0,0,0,0.8);margin-bottom:15px}
.main-text h1 span{color:#0066FF}
.main-text p{font-size:22px;color:rgba(255,255,255,0.6);font-weight:300}
/* Road markings */
.road-markings{position:absolute;bottom:100px;left:0;right:0;height:4px}
.marking{position:absolute;height:4px;background:#FFD600;opacity:0.5}
.marking:nth-child(1){left:5%;width:60px}
.marking:nth-child(2){left:15%;width:60px}
.marking:nth-child(3){left:25%;width:60px}
.marking:nth-child(4){left:35%;width:60px}
.marking:nth-child(5){left:45%;width:60px}
.marking:nth-child(6){left:55%;width:60px}
.marking:nth-child(7){left:65%;width:60px}
.marking:nth-child(8){left:75%;width:60px}
.marking:nth-child(9){left:85%;width:60px}
.marking:nth-child(10){left:95%;width:60px}
/* Vignette */
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,transparent 30%,rgba(0,0,0,0.6) 100%)}
</style>
</head>
<body>
<div class="scene">
<div class="sky">
<div class="star" style="top:5%;left:10%"></div>
<div class="star" style="top:12%;left:25%"></div>
<div class="star" style="top:8%;left:45%"></div>
<div class="star" style="top:15%;left:65%"></div>
<div class="star" style="top:6%;left:80%"></div>
<div class="star" style="top:18%;left:90%"></div>
<div class="star" style="top:10%;left:5%"></div>
<div class="star" style="top:20%;left:35%"></div>
</div>

<div class="buildings">
<div class="building b1"></div>
<div class="building b2"></div>
<div class="building b3"></div>
<div class="building b4"></div>
<div class="building b5"></div>
<div class="building b6"></div>
<div class="building b7"></div>
<div class="building b8"></div>
<div class="building b9"></div>
<div class="building b10"></div>
</div>

<div class="light-pole pole1"></div>
<div class="light-glow glow1"></div>
<div class="light-pole pole2"></div>
<div class="light-glow glow2"></div>
<div class="light-pole pole3"></div>
<div class="light-glow glow3"></div>

<div class="street">
<div class="sidewalk"></div>
<div class="road-markings">
<div class="marking"></div><div class="marking"></div><div class="marking"></div>
<div class="marking"></div><div class="marking"></div><div class="marking"></div>
<div class="marking"></div><div class="marking"></div><div class="marking"></div>
<div class="marking"></div>
</div>
</div>

<svg class="moto-svg" viewBox="0 0 150 80" style="position:absolute;bottom:155px;left:500px">
<path d="M30 50 Q35 40 50 35 L90 30 Q100 28 105 35 L110 45 Q115 55 105 60 L50 65 Q35 65 30 55 Z" fill="#0066FF"/>
<circle cx="45" cy="62" r="14" fill="#1a1a2e" stroke="#333"/>
<circle cx="45" cy="62" r="8" fill="#0066FF" opacity="0.6"/>
<circle cx="100" cy="62" r="14" fill="#1a1a2e" stroke="#333"/>
<circle cx="100" cy="62" r="8" fill="#0066FF" opacity="0.6"/>
<rect x="85" y="30" width="25" height="20" fill="#FFD600" rx="3"/>
<circle cx="55" cy="42" r="5" fill="#FFD600" opacity="0.8"/>
</svg>

<div class="billboard">
<div class="billboard-glow"></div>
<div class="billboard-inner">
<div class="billboard-logo">VROOM</div>
<div class="billboard-tag">Todo lo que mueve tu carro</div>
<div class="billboard-cta">vroom.app</div>
</div>
</div>

<div class="digital-screen">
<div class="screen-logo">VROOM</div>
<div class="screen-text">15 MIN<br>EXPRESS</div>
</div>

<div class="pedestrian">
<div class="ped-phone">
<div class="ped-screen">
<div class="ped-logo">VROOM</div>
</div>
</div>
<div class="ped-figure">
<div class="ped-head"></div>
</div>
</div>

<div class="vignette"></div>

<div class="overlay">
<div class="main-text">
<h1>VROOM is<br><span>already here.</span></h1>
<p>Caracas, 2026. The automotive future is now.</p>
</div>
</div>
</div>
</body>
</html>
